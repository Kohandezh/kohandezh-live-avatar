# Render server only (a droplet). Not for local development. See README.md in this folder.
# Use it as the second file, from the repository root:
#   COMPOSE_FILE=docker-compose.yml:apps/api/setup/server/docker-compose.server.yml
# Relative paths resolve from the project directory, which is the directory of the first file
# (the repository root). That is why the Caddyfile path starts at the root.
services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      # The public name of LiveKit. The Caddyfile reads it, so the domain is set in .env only.
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/api/setup/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [livekit]
    restart: unless-stopped
    networks: [avatar]
  livekit:
    # Docker publishes ports around ufw, so the signalling port is bound to localhost.
    # The public entry is Caddy (wss) on 443.
    ports: !override
      - "127.0.0.1:7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
  frontend:
    ports: !override
      - "127.0.0.1:8088:80"
volumes:
  caddy-data:
  caddy-config:
