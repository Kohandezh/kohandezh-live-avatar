[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services"]
addopts = "--strict-markers"
markers = ["provider: opt-in tests that can consume provider credits"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["services/media"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]

