name: CI

on:
  pull_request:
  push:
    branches: [main]

# Provider credits are never spent in CI: the workflow copies .env.example (placeholder keys),
# REAL_PROVIDER_TESTS stays false and CONFIRM_CREDIT_USAGE is never set.
jobs:
  frontend:
    name: Frontend check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  backend:
    name: Backend tests (Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder environment (no real credentials)
        run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build orchestrator
      - run: docker compose run --rm orchestrator pytest -q
      - name: Provider usage must stay empty
        if: always()
        run: docker compose down -v --remove-orphans
