name: CI

on:
  pull_request:
  push:
    branches: [main]

# Provider credits are never spent in CI: the workflow copies .env.example (placeholder keys),
# REAL_PROVIDER_TESTS stays false and CONFIRM_CREDIT_USAGE is never set.
jobs:
  frontend:
    name: Frontend check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build

  e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/frontend exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

  backend:
    name: Backend tests (Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder environment (no real credentials)
        run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build orchestrator
      - run: docker compose run --rm orchestrator pytest -q
      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
